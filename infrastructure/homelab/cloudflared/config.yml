# Cloudflare Tunnel Configuration
# Place at /etc/cloudflared/config.yml or ~/.cloudflared/config.yml

tunnel: <YOUR_TUNNEL_UUID>
credentials-file: /etc/cloudflared/<YOUR_TUNNEL_UUID>.json

ingress:
  # Route traffic for api.openidear.com to backend Docker container
  - hostname: api.openidear.com
    service: http://backend-api:5001
    originRequest:
      connectTimeout: 10s
      noTLSVerify: true
      keepAliveTimeout: 90s
      http2Origin: true

  # Default fallback 404 rule (mandatory)
  - service: http_status:404
